name: "gruvbox-material-dark"
polarity: "dark"
pair: "gruvbox-material-light"

tools:

  tmux:
    clock: 180
    colors:
      dim: "$fg_dim$"
      pink: "$pink$"
      yellow: "$yellow$"
      selected:
        fg: "$orange$"
        bg: "$panel_inset$"

  fzf:
    fg: "$fg_primary$"
    bg: "-1"
    hl: "$orange$"
    selected_bg: "$panel$"
    info: "$blue$"
    border: "$pink$"
    prompt: "$orange$"
    pointer: "$terracotta$"
    marker: "$yellow$"
    spinner: "$purple$"
    header: "$fg_dim$"
    separator: "$border$"
    label: "$fg_secondary$"

  interdimux:
    accent:        "$orange$"
    path:          "$yellow$"
    git:           "$purple$"
    ssh:           "$blue$"
    editor:        "$green$"
    success:       "$green$"
    danger:        "$red$"
    tree:          "$fg_faint$"
    separator:     "$border$"
    query:         "$fg_primary$"
    match_current: "$orange$"
    current_bg:    "$panel_inset$"
    header:        "$fg_dim$"
    border:        "$border$"
    menu_sel_fg:   "$bg_primary$"

  ipython:
    pygments_style: "gruvbox-dark"

  ghostty:
    name: "Gruvbox Material Dark"

  kitty:

  zsh:
    colors:
      # truecolor from the gruvbox palette (PROMPT-1). Roles, not literal names:
      # a quieter map — muted-grey git structure, soft terracotta branch (matches tmux).
      red:     "$red$"      # error: failed ❯, RPS1 ✘
      cyan:    "$aqua$"     # path: cwd
      blue:    "$grey1$"    # muted structure: git:( ) punctuation, venv name, jobs ⚙
      green:   "$green$"    # ok: prompt ❯ (success) + transient glyph
      yellow:  "$yellow$"   # accents: dirty ✗, venv ‹ ›, vi ❮, command timer
      magenta: "$pink$"     # branch (soft terracotta #d4967e — echoes the tmux accent)
      comment: "$fg_faint$" # syntax-highlight comments

  colorls:
    unrecognized_file: "$blue$"
    recognized_file: "$aqua$"
    executable_file: "$green$"
    dir: "$orange$"
    dead_link: "$red$"
    link: "$aqua$"
    device: "$green$"
    write: "$blue$"
    read: "$purple$"
    exec: "$pink$"
    no_access: "$fg_dim$"
    day_old: "$purple$"
    hour_old: "$peach$"
    no_modifier: "$fg_faint$"
    file_large: "$orange$"
    file_medium: "$yellow$"
    file_small: "$fg_muted$"
    report: "$fg_primary$"
    user: "$blue$"
    tree: "$fg_faint$"
    empty: "$yellow$"
    error: "$red$"
    normal: "$fg_secondary$"
    inode: "$blue$"
    addition: "$green$"
    modification: "$yellow$"
    deletion: "$red$"
    untracked: "$orange$"
    unchanged: "$aqua$"

  nvim:
    colorscheme: "catppuccin"
    scheme: "gruvbox-material"
    theme: "mocha"
    vanilla: false
    winblend: 0
    plugin: |
      { "catppuccin/nvim", name = "catppuccin", priority = 1000 }
    catppuccin_overrides:
      rosewater: "$pink$"
      flamingo: "$terracotta$"
      pink: "$pink$"
      mauve: "$purple$"
      red: "$red$"
      maroon: "$terracotta$"
      peach: "$orange$"
      yellow: "$yellow$"
      green: "$green$"
      teal: "$aqua$"
      sky: "$blue$"
      sapphire: "$aqua$"
      blue: "$blue$"
      lavender: "$fg_secondary$"
      text: "$fg_primary$"
      subtext1: "$fg_secondary$"
      subtext0: "$grey1$"
      overlay2: "$fg_dim$"
      overlay1: "$fg_faint$"
      overlay0: "$border$"
      surface2: "$panel_raised$"
      surface1: "$panel$"
      surface0: "$panel_inset$"
      base: "$bg_primary$"
      mantle: "$bg_deep$"
      crust: "$bg_abyss$"
    fields:
      bg: "base"
      fg: "text"
      alt_bg: "mantle"
      alt_fg: "surface2"
      comment: "overlay0"
      yellow: "yellow"
      green: "green"
      orange: "peach"
      blue: "blue"
      red: "red"
      mauve: "mauve"
      pink: "pink"
      teal: "teal"
      sky: "sky"
      accent: "pink"
      dark_bg: "crust"
      light_bg: "surface0"
      none: "NONE"
