[project]
name = "interdotensional"
version = "0.2.0"
description = "Unified theme & font generator for dotfiles - one palette, every tool."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
]

[project.scripts]
interdot = "interdotensional.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
