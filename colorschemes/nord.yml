# Nord (dark). Upstream hexes unchanged: https://www.nordtheme.com/docs/colors-and-palettes
# Polar Night / Snow Storm / Frost / Aurora keep their nord.nvim names; the contract
# tokens below anchor to them, and every synthesised step says how it was made.
# Nord has nothing darker than nord0, so bg_deep/bg_abyss are nord0 stepped down,
# and nothing between nord4 and nord3.5, so the muted/dim/faint/grey1 steps are
# mixes along that line (mix(nord4, nord3.5, N)).
origin:         &origin         "#2e3440"  # nord0: the terminal background (ghostty "Nord")
bright:         &bright         "#3b4252"  # nord1
brighter:       &brighter       "#434c5e"  # nord2
brightest:      &brightest      "#4c566a"  # nord3
light:          &light          "#616e88"  # nord3 brightened (nord.nvim polar_night.light): the comment grey, 2.43:1
snow:           &snow           "#d8dee9"  # nord4: the standard fg
snow_brighter:  &snow_brighter  "#e5e9f0"  # nord5 (unused by the theme config)
snow_brightest: &snow_brightest "#eceff4"  # nord6: emphasis text
polar_water:    &polar_water    "#8fbcbb"  # nord7 (upstream: types; here the aqua — nvim types are nord13, see docs/nord.md)
ice:            &ice            "#88c0d0"  # nord8: functions, the leaf brand (ANSI cyan)
artic_water:    &artic_water    "#81a1c1"  # nord9: keywords/operators (ANSI blue)
artic_ocean:    &artic_ocean    "#5e81ac"  # nord10 (unused: 3.10:1 on nord0)
# accents (aurora, upstream; the three low-contrast ones are kept on purpose — see docs/nord.md)
red:            &red            "#bf616a"  # nord11: 3.05:1 on nord0
orange:         &orange         "#d08770"  # nord12: 4.39:1 on nord0
yellow:         &yellow         "#ebcb8b"  # nord13: 8.00:1
green:          &green          "#a3be8c"  # nord14: 6.13:1
aqua:           *polar_water               # nord7 (5.99:1): cwd, colorls links, nvim teal/sapphire
blue:           *artic_water               # nord9 (4.64:1): info, fzf info, nvim keywords/operators
purple:         &purple         "#b48ead"  # nord15: 4.41:1 on nord0
pink:           *purple                    # THE UI accent: today's tools.tmux.colors.pink
peach:          *orange                    # nord's only warm that reads (red is 3.05:1)
terracotta:     *orange                    # brand warm: fzf pointer, nvim flamingo
maroon:         "#c9939d"                  # synthesised soft rose: mix(nord11, nord4, 40), 4.84:1 — nvim parameters
# text ladder (nord6 emphasis, nord4 standard body, then synthesised steps toward nord3.5)
fg_primary:     *snow_brightest            # nord6 (10.84:1): fzf fg, interdimux query, colorls report, nvim text
fg_secondary:   *snow                      # nord4 (9.25:1): leaf body, colorls normal, nvim subtext1/lavender
fg_muted:       &fg_muted       "#a8b1c2"  # synthesised: mix(nord4, nord3.5, 40), 5.79:1
fg_dim:         "#8b95aa"                  # synthesised: mix(nord4, nord3.5, 65), 4.15:1 (3.34:1 on the nord1 selection)
fg_faint:       "#6d7992"                  # synthesised: mix(nord4, nord3.5, 90), 2.85:1 (body text reads 3.24:1 on it)
# surfaces (nord1..nord3 are the raised steps; below nord0 is synthesised)
border:         *light                     # nord3.5: hard lines and nvim comments (overlay0)
panel_raised:   *brightest                 # nord3
panel:          *brighter                  # nord2
panel_inset:    *bright                    # nord1: the selection surface
bg_primary:     *origin                    # nord0 == ghostty "Nord" background
bg_deep:        "#292e39"                  # synthesised: darken(nord0, 2.5), 1.09:1 on nord0 — chrome, nvim mantle
bg_abyss:       "#232831"                  # synthesised: darken(nord0, 5), 1.09:1 on bg_deep — nvim crust
# greys (Nord's blue-grey line; grey1 must clear 4.02:1 for the zsh git punctuation)
grey0:          *light                     # nord3.5, the palette's own comment grey
grey1:          "#919baf"                  # synthesised: mix(nord4, nord3.5, 60), 4.47:1 — leaf dim, zsh blue, nvim subtext0
grey2:          *fg_muted                  # lightest neutral (vocabulary only)
# leaf ladder aliases (fg1 = emphasis must out-contrast fg0 = body)
fg0:            *snow                      # = fg_secondary
fg1:            *snow_brightest            # = fg_primary
