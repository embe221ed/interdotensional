name: "tokyonight-day"
polarity: "light"
pair: "tokyonight-storm"

tools:

  tmux:
    clock: 213
    colors:
      dim: "$dark3$"
      pink: "$magenta2$"
      yellow: "$yellow$"
      selected:
        fg: "$magenta2$"
        bg: "$bg_dark$"

  kitty:
    name: "Tokyonight-Day"

  fzf:
    fg: "$fg$"
    bg: "-1"
    hl: "$orange$"
    selected_bg: "$bg_highlight$"
    info: "$blue$"
    border: "$magenta2$"
    prompt: "$green$"
    pointer: "$red$"
    marker: "$yellow$"
    spinner: "$magenta$"
    header: "$dark3$"
    separator: "$fg_gutter$"
    label: "$fg_dark$"

  ipython:
    pygments_style: "friendly"

  ghostty:
    name: "TokyoNight Day"

  zsh:
    colors:
      red: 197
      cyan: 31
      blue: 68
      green: 65
      yellow: 94
      magenta: 98
      comment: "$comment$"

  colorls:
    unrecognized_file: "$blue$"
    recognized_file: "$cyan$"
    executable_file: "$green$"
    dir: "$orange$"
    dead_link: "$red$"
    link: "$cyan$"
    device: "$green$"
    write: "$blue$"
    read: "$purple$"
    exec: "$magenta2$"
    no_access: "$dark3$"
    day_old: "$purple$"
    hour_old: "$orange$"
    no_modifier: "$comment$"
    file_large: "$orange$"
    file_medium: "$yellow$"
    file_small: "$fg_dark$"
    report: "$fg$"
    user: "$blue$"
    tree: "$comment$"
    empty: "$yellow$"
    error: "$red$"
    normal: "$fg_dark$"
    inode: "$blue$"
    addition: "$green$"
    modification: "$yellow$"
    deletion: "$red$"
    untracked: "$orange$"
    unchanged: "$cyan$"

  nvim:
    colorscheme: "tokyonight"
    theme: "day"
    vanilla: false
    winblend: 0
    plugin: |
      {
        "folke/tokyonight.nvim",
        lazy = false,
        priority = 1000,
        opts = {},
      }
    fields:
      bg: "bg"
      fg: "fg"
      alt_bg: "bg_dark"
      alt_fg: "fg_gutter"
      comment: "comment"
      yellow: "yellow"
      green: "green"
      orange: "orange"
      blue: "blue"
      red: "red"
      mauve: "magenta"
      pink: "magenta2"
      teal: "blue1"
      sky: "blue5"
      accent: "magenta2"
      dark_bg: "bg_dark1"
      light_bg: "bg_highlight"
      none: "NONE"
