# theme: "catppuccin-frappe"
theme: "gruvbox-material-dark"

font: "maple-mono"

ui:
  border: "none"

tmux:
  history_limit: 50000
  display_time: 3000
  pane:
    border:
      lines: "single"
      format: " #{user}@#{host_short}:#{s|#(echo $HOME)|~|:pane_current_path} "
      status: "top"
      indicators: "off"
  popup:
    border:
      style: "bold"

zsh:
  # 1 = single-line ➜ prompt; 2 = two-line prompt with a bare ❯ input line (PROMPT-7).
  prompt:
    lines: 2
  # Which highlighter's style array the comment color is themed into (CFG-4/UX-5):
  # "fast" = fast-syntax-highlighting (FAST_HIGHLIGHT_STYLES), "std" = zsh-syntax-highlighting.
  # Keep in sync with the plugin listed in ~/.zshrc's plugins=() array.
  highlighter: "fast"

# Run after a generate that changed at least one file (skip with --no-hooks):
hooks:
  # Reload tmux only when a server is running, so the hook can't fail the
  # generate when tmux is not up.
  - "tmux ls >/dev/null 2>&1 && tmux source-file ~/.tmux.conf || true"
  # Push the new fzf colors into tmux's global env, so popups that launch fzf
  # from the server environment (rather than through a zsh) are themed too.
  # Lives here, not in display_mode.sh, so a bare `interdot toggle` themes them
  # as well — and because nothing can run after that script's `exec zsh`.
  - 'tmux ls >/dev/null 2>&1 && tmux setenv -g FZF_DEFAULT_OPTS "$(. output/fzf/fzf-colors.sh && printf %s "$FZF_DEFAULT_OPTS")" || true'

# Symlink dotfile locations to generated output, applied by `interdot link`:
links:
  # zsh: the generated omz custom fragment + prompt theme, auto-sourced by oh-my-zsh
  # from $ZSH_CUSTOM/*.zsh and $ZSH_CUSTOM/themes/ respectively.
  ~/.oh-my-zsh/custom/interdot.zsh: zsh/interdot.zsh
  ~/.oh-my-zsh/custom/themes/theme.zsh-theme: zsh/theme.zsh-theme
  # nvim: the generated halves of two COMMITTED shims. nvim/lua/globals.lua and
  # nvim/lua/ui/colors.lua pcall-load these siblings and work without them.
  # Targeted at ~/.config/nvim/... and NOT at $DOTFILES/..., so this entry is
  # correct both before and after the scripts->dotfiles split and needs no
  # per-machine variant. ~/.config/nvim must already be a SYMLINK when this
  # runs — `interdot link` mkdir -p's the parent, so it would otherwise create
  # a real directory. install.sh always runs first.
  ~/.config/nvim/lua/globals.generated.lua: nvim/globals.lua
  ~/.config/nvim/lua/ui/colors.generated.lua: nvim/colors.lua
  # kitty: DORMANT. kitty is installed on NEITHER machine (0.5.1), so this
  # writes into a plain $HOME directory that no repo claims — inert clutter,
  # kept because the entry is right the day kitty comes back. It must stay a
  # path INSIDE the config directory: kitty resolves `include` relative to the
  # file holding kitty.conf and finds its OS-appearance themes by filename
  # there. Same $HOME targeting, same before-and-after reason as the nvim pair.
  ~/.config/kitty/kitty.conf: kitty/kitty.conf
  # ghostty: 100% interdotensional-owned. The dotfiles repo ships nothing for
  # ghostty at all (the shaders were deleted and `config` was this same
  # generated symlink), so this writes into a plain $HOME directory that no
  # repository claims, and install.sh has no ghostty row.
  ~/.config/ghostty/config: ghostty/config
  # zellij: identical shape to ghostty, and added for the identical reason.
  # configs/zellij/ held ONLY this generated symlink, so 2.3 deletes the whole
  # directory and the dotfiles repo ships nothing for zellij either. zellij IS
  # installed on the Mac (~/.cargo/bin/zellij) and reached its config through
  # the old ~/.config/zellij -> configs/zellij DIRECTORY symlink; without this
  # entry nothing owns it after 2.3 and the main machine loses it silently.
  ~/.config/zellij/config.kdl: zellij/config.kdl
  # tmux + colorls: previously hand-made links with NO owner — they existed on
  # the host and devContainer.dockerfile:442-443 recreated them by hand. Given
  # an owner here because they point straight at this generator's output and
  # nothing else. Phase 7 deletes those two Dockerfile lines.
  # colorls is a DIRECTORY link (output/colorls holds dark_colors.yaml,
  # light_colors.yaml and the tracked files.yaml asset from 2.2); links.py
  # only does `source.exists()` + `symlink_to`, so a directory source is fine.
  ~/.tmux.conf: tmux/.tmux.conf
  ~/.config/colorls: colorls
  # leaf's config.toml points straight at output/leaf/theme.toml; enable this
  # link instead (with `theme = "theme.toml"`) to avoid the absolute path.
#   ~/.config/leaf/theme.toml: leaf/theme.toml

nvim:
  symbols:
    expand: ""
    collapse: ""
  statusline:
    laststatus: 3
  goto_preview:
    border: [ " ", " " ," ", " ", " ", " ", " ", " " ]
    # border: [ "├", "─" ,"╮", "│", "╯", "─", "╰", "│" ]
    title_length: 60
  lsp:
    doc:
      border: false
    diagnostic:
      border: "solid"
