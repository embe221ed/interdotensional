name: "catppuccin-frappe"

tools:

  tmux:
    clock: 219
    colors:
      dim: "$overlay2$"
      pink: "$pink$"
      selected:
        fg: "$pink$"
        bg: "$surface0$"
    powerline:
      colors:
        bg: "$surface0$"
        tint_bg0: "$overlay0$"
        tint_bg1: "$text$"
        selected: "$peach$"
        eggplant: "$pink$"
        blue: "$blue$"

  fzf:
    fg: "$text$"
    bg: "$base$"
    hl: "$peach$"
    selected_fg: "$text$"
    selected_bg: "$surface0$"
    selected_hl: "$peach$"
    info: "$blue$"
    border: "$overlay0$"
    prompt: "$green$"
    pointer: "$red$"
    marker: "$yellow$"
    spinner: "$mauve$"
    header: "$overlay1$"
    preview_fg: "$text$"
    preview_bg: "$mantle$"
    gutter: "$surface0$"
    separator: "$overlay0$"
    label: "$subtext1$"
    query: "$text$"
    disabled: "$overlay1$"
    scrollbar: "$overlay0$"
    preview_border: "$overlay0$"
    preview_label: "$subtext1$"

  ipython:
    pygments_style: "monokai"

  ghostty:
    name: "Catppuccin Frappe"

  kitty:

  zsh:
    colors:
      red: 203
      cyan: 117
      blue: 110
      green: 149
      yellow: 179
      magenta: 176

  colorls:
    unrecognized_file: cadetblue
    recognized_file: deepskyblue
    executable_file: darkturquoise
    dir: fuchsia
    dead_link: red
    link: cyan
    socket: green
    blockdev: green
    chardev: green
    write: royalblue
    read: magenta
    exec: deeppink
    no_access: dimgray
    day_old: blueviolet
    hour_old: darkviolet
    no_modifier: violet
    file_large: orange
    file_medium: gold
    file_small: peachpuff
    report: white
    user: darkslateblue
    tree: cyan
    empty: yellow
    error: red
    normal: darkkhaki
    inode: blue
    addition: chartreuse
    modification: darkkhaki
    deletion: darkred
    untracked: darkorange
    unchanged: forestgreen

  nvim:
    colorscheme: "catppuccin"
    theme: "frappe"
    vanilla: false
    winblend: 0
    plugin: |
      { "catppuccin/nvim", name = "catppuccin", priority = 1000 }
    fields:
      bg: "base"
      fg: "text"
      alt_bg: "mantle"
      alt_fg: "surface2"
      comment: "overlay0"
      yellow: "yellow"
      green: "green"
      orange: "peach"
      blue: "blue"
      red: "red"
      mauve: "mauve"
      pink: "pink"
      teal: "teal"
      sky: "sky"
      accent: "pink"
      dark_bg: "crust"
      light_bg: "surface0"
      none: "NONE"
