
# popup!
bind-key -n M-p if-shell -F '#{==:#{session_name},scratch}' {
  detach-client
} {
  # scratch gets detach-on-destroy on (global is off) so exiting it closes the
  # popup instead of falling back onto the next session
  display-popup -w70% -h70% -E "tmux has-session -t scratch 2>/dev/null || tmux new-session -d -s scratch -c ~; tmux set-option -t scratch detach-on-destroy on; tmux attach -t scratch"
}

# floating pane (prefix + *): non-modal, themed borders, opens in the current path
bind-key * new-pane -c '#{pane_current_path}' -S "fg={{ tmux_theme.colors.pink }}" -R "fg={{ tmux_theme.colors.dim }}"
