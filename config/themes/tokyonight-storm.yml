name: "tokyonight-storm"
polarity: "dark"
pair: "tokyonight-day"

tools:

  tmux:
    clock: 213
    colors:
      dim: "$dark3$"
      pink: "$magenta2$"
      yellow: "$yellow$"
      selected:
        fg: "$orange$"
        bg: "$bg_highlight$"

  fzf:
    fg: "$fg$"
    bg: "-1"
    hl: "$orange$"
    selected_bg: "$bg_highlight$"
    info: "$blue$"
    border: "$magenta$"
    prompt: "$green$"
    pointer: "$red$"
    marker: "$yellow$"
    spinner: "$purple$"
    header: "$dark5$"
    separator: "$fg_gutter$"
    label: "$fg_dark$"

  ipython:
    pygments_style: "native"

  leaf:
    base: "ocean"                # built-in preset backing any key the theme doesn't set
    syntax: "base16-ocean.dark"  # syntect theme for fenced code blocks
    colors:
      # surfaces
      bg:        "$bg$"            # content background
      bg_deep:   "$bg_dark$"       # chrome: TOC + status bar background
      panel:     "$bg_highlight$"  # chips: filename/search badges, inline code, active TOC row
      border:    "$blue0$"         # hard lines: rules, heading underline, table separators (upstream border_highlight navy)
      faint:     "$fg_gutter$"     # soft lines: code frame/gutter, table borders, inactive TOC index
      # text ladder (terminal idiom: fg_dark body, fg bold — tokyonight's white vs bright-white)
      fg:        "$fg_dark$"       # body text
      fg_strong: "$fg$"            # bold text, active TOC entry, marked text
      muted:     "$dark5$"         # de-emphasized: inactive TOC entries
      dim:       "$comment$"       # chrome text: separators, shortcuts, code labels, blockquote bar
      # accents (tokyonight idiom: blue brand, magenta keywords, teal for links)
      accent:    "$blue$"          # brand: status badge, search, H1, table headers, scrollbar
      accent2:   "$magenta$"       # TOC marker, inline code, H5+, mermaid keywords
      success:   "$green$"         # watch/reload badges, tips, checked tasks, H2
      info:      "$blue1$"         # links, notes, H3 (teal keeps H3 distinct from the blue H1)
      special:   "$purple$"        # LaTeX, H4, important alerts
      warning:   "$yellow$"        # warning status + alerts
      danger:    "$red$"           # errors, caution alerts

  ghostty:
    name: "TokyoNight Storm"

  kitty:
    name: "tokyonight_storm"

  zsh:
    colors:
      red: 210
      cyan: 117
      blue: 111
      green: 149
      yellow: 179
      magenta: 141
      comment: "$comment$"

  colorls:
    unrecognized_file: "$blue$"
    recognized_file: "$cyan$"
    executable_file: "$green$"
    dir: "$orange$"
    dead_link: "$red$"
    link: "$cyan$"
    device: "$green$"
    write: "$blue$"
    read: "$purple$"
    exec: "$magenta2$"
    no_access: "$dark3$"
    day_old: "$purple$"
    hour_old: "$orange$"
    no_modifier: "$dark5$"
    file_large: "$orange$"
    file_medium: "$yellow$"
    file_small: "$fg_dark$"
    report: "$fg$"
    user: "$blue$"
    tree: "$dark5$"
    empty: "$yellow$"
    error: "$red$"
    normal: "$fg_dark$"
    inode: "$blue$"
    addition: "$green$"
    modification: "$yellow$"
    deletion: "$red$"
    untracked: "$orange$"
    unchanged: "$green1$"

  nvim:
    colorscheme: "tokyonight"
    theme: "storm"
    vanilla: false
    winblend: 0
    plugin: |
      {
            "folke/tokyonight.nvim",
            lazy = false,
            priority = 1000,
            opts = {},
          }
    fields:
      bg: "bg"
      fg: "fg"
      alt_bg: "bg_dark"
      alt_fg: "fg_gutter"
      comment: "comment"
      yellow: "yellow"
      green: "green"
      orange: "orange"
      blue: "blue"
      red: "red"
      mauve: "magenta"
      pink: "magenta2"
      teal: "blue1"
      sky: "blue5"
      accent: "magenta2"
      dark_bg: "bg_dark1"
      light_bg: "bg_highlight"
      none: "NONE"
