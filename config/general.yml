# theme: "catppuccin-frappe"
theme: "gruvbox-material-dark"

font: "maple-mono"

ui:
  border: "none"

tmux:
  pane:
    border:
      style: "bold"
      lines: "heavy"
      format: " #{user}@#{host_short}:#{s|#(echo $HOME)|~|:pane_current_path} "
      status: "top"
  popup:
    border:
      style: "bold"

nvim:
  symbols:
    expand: ""
    collapse: ""
  statusline:
    laststatus: 3
  goto_preview:
    border: [ " ", " " ," ", " ", " ", " ", " ", " " ]
    # border: [ "├", "─" ,"╮", "│", "╯", "─", "╰", "│" ]
    title_length: 60
  lsp:
    doc:
      border: false
    diagnostic:
      border: "solid"
