name: "catppuccin-frappe"
polarity: "dark"
pair: "catppuccin-latte"

tools:

  tmux:
    clock: 219
    colors:
      dim: "$overlay2$"
      pink: "$pink$"
      yellow: "$yellow$"
      selected:
        fg: "$pink$"
        bg: "$surface0$"

  fzf:
    fg: "$text$"
    bg: "-1"
    hl: "$peach$"
    selected_bg: "$surface1$"
    info: "$blue$"
    border: "$pink$"
    prompt: "$green$"
    pointer: "$red$"
    marker: "$yellow$"
    spinner: "$mauve$"
    header: "$overlay1$"
    separator: "$overlay0$"
    label: "$subtext1$"

  ipython:
    pygments_style: "monokai"

  ghostty:
    name: "Catppuccin Frappe"

  kitty:

  zsh:
    colors:
      red: 203
      cyan: 117
      blue: 110
      green: 149
      yellow: 179
      magenta: 176
      comment: "$overlay0$"

  colorls:
    unrecognized_file: cadetblue
    recognized_file: deepskyblue
    executable_file: darkturquoise
    dir: fuchsia
    dead_link: red
    link: cyan
    device: green
    write: royalblue
    read: magenta
    exec: deeppink
    no_access: dimgray
    day_old: blueviolet
    hour_old: darkviolet
    no_modifier: violet
    file_large: orange
    file_medium: gold
    file_small: peachpuff
    report: white
    user: darkslateblue
    tree: cyan
    empty: yellow
    error: red
    normal: darkkhaki
    inode: blue
    addition: chartreuse
    modification: darkkhaki
    deletion: darkred
    untracked: darkorange
    unchanged: forestgreen

  nvim:
    colorscheme: "catppuccin"
    theme: "frappe"
    vanilla: false
    winblend: 0
    plugin: |
      { "catppuccin/nvim", name = "catppuccin", priority = 1000 }
    fields:
      bg: "base"
      fg: "text"
      alt_bg: "mantle"
      alt_fg: "surface2"
      comment: "overlay0"
      yellow: "yellow"
      green: "green"
      orange: "peach"
      blue: "blue"
      red: "red"
      mauve: "mauve"
      pink: "pink"
      teal: "teal"
      sky: "sky"
      accent: "pink"
      dark_bg: "crust"
      light_bg: "surface0"
      none: "NONE"
