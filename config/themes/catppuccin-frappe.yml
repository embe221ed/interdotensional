name: "catppuccin-frappe"
polarity: "dark"
pair: "catppuccin-latte"

tools:

  tmux:
    clock: 219
    colors:
      dim: "$overlay2$"
      pink: "$pink$"
      yellow: "$yellow$"
      selected:
        fg: "$pink$"
        bg: "$surface0$"

  fzf:
    fg: "$text$"
    bg: "-1"
    hl: "$peach$"
    selected_bg: "$surface1$"
    info: "$blue$"
    border: "$pink$"
    prompt: "$green$"
    pointer: "$red$"
    marker: "$yellow$"
    spinner: "$mauve$"
    header: "$overlay1$"
    separator: "$overlay0$"
    label: "$subtext1$"

  ipython:
    pygments_style: "monokai"

  leaf:
    base: "ocean"                # built-in preset backing any key the theme doesn't set
    syntax: "base16-ocean.dark"  # syntect theme for fenced code blocks
    colors:
      # surfaces
      bg:        "$base$"       # content background
      bg_deep:   "$mantle$"     # chrome: TOC + status bar background
      panel:     "$surface0$"   # chips: filename/search badges, inline code, active TOC row
      border:    "$overlay0$"   # hard lines: rules, heading underline, table separators
      faint:     "$surface1$"   # soft lines: code frame/gutter, table borders, inactive TOC index
      # text ladder (rosewater sits just above text — frappe's brightest neutral for emphasis)
      fg:        "$text$"       # body text
      fg_strong: "$rosewater$"  # bold text, active TOC entry, marked text
      muted:     "$subtext0$"   # de-emphasized: inactive TOC entries
      dim:       "$overlay1$"   # chrome text: separators, shortcuts, code labels, blockquote bar
      # accents (pink brand echoes tmux/nvim; teal secondary keeps mauve free for H4)
      accent:    "$pink$"       # brand: status badge, search, H1, table headers, scrollbar
      accent2:   "$teal$"       # TOC marker, inline code, H5+, mermaid keywords
      success:   "$green$"      # watch/reload badges, tips, checked tasks, H2
      info:      "$blue$"       # links, notes, H3
      special:   "$mauve$"      # LaTeX, H4, important alerts
      warning:   "$yellow$"     # warning status + alerts
      danger:    "$red$"        # errors, caution alerts

  ghostty:
    name: "Catppuccin Frappe"

  kitty:

  zsh:
    colors:
      red: 203
      cyan: 117
      blue: 110
      green: 149
      yellow: 179
      magenta: 176
      comment: "$overlay0$"

  colorls:
    unrecognized_file: cadetblue
    recognized_file: deepskyblue
    executable_file: darkturquoise
    dir: fuchsia
    dead_link: red
    link: cyan
    device: green
    write: royalblue
    read: magenta
    exec: deeppink
    no_access: dimgray
    day_old: blueviolet
    hour_old: darkviolet
    no_modifier: violet
    file_large: orange
    file_medium: gold
    file_small: peachpuff
    report: white
    user: darkslateblue
    tree: cyan
    empty: yellow
    error: red
    normal: darkkhaki
    inode: blue
    addition: chartreuse
    modification: darkkhaki
    deletion: darkred
    untracked: darkorange
    unchanged: forestgreen

  nvim:
    colorscheme: "catppuccin"
    theme: "frappe"
    vanilla: false
    winblend: 0
    plugin: |
      { "catppuccin/nvim", name = "catppuccin", priority = 1000 }
    fields:
      bg: "base"
      fg: "text"
      alt_bg: "mantle"
      alt_fg: "surface2"
      comment: "overlay0"
      yellow: "yellow"
      green: "green"
      orange: "peach"
      blue: "blue"
      red: "red"
      mauve: "mauve"
      pink: "pink"
      teal: "teal"
      sky: "sky"
      accent: "pink"
      dark_bg: "crust"
      light_bg: "surface0"
      none: "NONE"
