{%- set p = tmux_theme.colors.pink -%}
{%- set y = tmux_theme.colors.yellow -%}
{%- set d = tmux_theme.colors.dim -%}
{#- flag(cond, glyph, color): render " glyph " in color when cond is truthy, else nothing -#}
{%- macro flag(cond, glyph, color) -%}
#{?{{ cond }},#[fg={{ color }}]{{ glyph }} ,}
{%- endmacro -%}
{#- flag_unless(cond, body): render "body " only when cond is FALSE (an inverted flag) -#}
{%- macro flag_unless(cond, body) -%}
#{?{{ cond }},,{{ body }} }
{%- endmacro -%}
{#- the three built-in key-tables; used to hide the table name unless it's a custom one -#}
{%- set builtin_table = '#{||:#{||:#{==:#{client_key_table},root},#{==:#{client_key_table},prefix}},#{==:#{client_key_table},off}}' %}
# status line
set-option -g status on
set-option -g status-interval 2
set-option -g status-style "bg=default,fg={{ d }}"

# left: a quiet session sigil (the session name lives here now, not on the right rail)
set-option -g status-left "#[fg={{ d }}] #S #[fg={{ p }}]❯ "
set-option -g status-left-length 30

# right: context + transient flags only — remote host (SSH only), key-table / nested off-mode, prefix, copy-mode, sync
set-option -g status-right-length 70
set-option -g status-right "{{ flag('SSH_CONNECTION', ' #{host_short}', p) -}}
{{- flag('#{==:#{client_key_table},off}', '󰌾', p) -}}
{{- flag_unless(builtin_table, '#[fg=' ~ p ~ ']#{client_key_table}') -}}
{{- flag('client_prefix', '●', y) -}}
{{- flag('pane_in_mode', '▲', p) -}}
{{- flag('pane_synchronized', '⇋', 'red') -}}
#[fg=default]"

# windows: left-aligned index:name list with the ❘ bufferline separator, plus a state palette
set-option -g status-justify left
set -g window-status-separator "#[fg={{ d }}]❘ "
set -g window-status-format "#I:#W "
set -g window-status-current-format "#I:#W "
set -g window-status-current-style "#{?window_zoomed_flag,fg={{ y }},fg={{ p }}},bold"
set -g window-status-style "fg={{ d }}"
set -g window-status-activity-style "fg={{ y }},nobold"
set -g window-status-bell-style "fg=red,nobold"
