
# === nested tmux: F12 mutes the OUTER server so keys reach an inner tmux (e.g. over SSH) ===
bind-key -T root F12 {
  set prefix None
  set key-table off
  set status-style "fg={{ tmux_theme.colors.dim }},bg={{ tmux_theme.colors.selected.bg }}"
  refresh-client -S
}
bind-key -T off F12 {
  set -u prefix
  set -u key-table
  set -u status-style
  refresh-client -S
}
