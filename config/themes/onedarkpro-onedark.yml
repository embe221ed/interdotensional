name: "onedarkpro-onedark"
polarity: "dark"

tools:

  tmux:
    clock: 170
    colors:
      dim: "$comment$"
      pink: "$purple$"
      yellow: "$yellow$"
      selected:
        fg: "$purple$"
        bg: "$cursorline$"

  fzf:
    fg: "$fg$"
    bg: "-1"
    hl: "$orange$"
    selected_bg: "$selection$"
    info: "$blue$"
    border: "$purple$"
    prompt: "$green$"
    pointer: "$red$"
    marker: "$yellow$"
    spinner: "$purple$"
    header: "$comment$"
    separator: "$gray$"
    label: "$fg$"

  ipython:
    pygments_style: "one-dark"

  leaf:
    base: "ocean"                # built-in preset backing any key the theme doesn't set
    syntax: "base16-ocean.dark"  # syntect theme for fenced code blocks
    colors:
      # surfaces (onedarkpro has no deeper-than-bg token; cursorline is the nearest chrome shade)
      bg:        "$bg$"          # content background
      bg_deep:   "$cursorline$"  # chrome: TOC + status bar background
      panel:     "$selection$"   # chips: filename/search badges, inline code, active TOC row
      border:    "$selection$"   # hard lines: rules, heading underline, table separators (quieter than the $gray$ soft lines, like the gruvbox reference)
      faint:     "$gray$"        # soft lines: code frame/gutter, table borders, inactive TOC index ($selection$ vanishes against the cursorline chrome)
      # text ladder (fg is the palette's brightest neutral — white is the same hex — so bold reuses it)
      fg:        "$fg$"          # body text
      fg_strong: "$fg$"          # bold text, active TOC entry, marked text
      muted:     "$comment$"     # de-emphasized: inactive TOC entries
      dim:       "$comment$"     # chrome text: separators, shortcuts, code labels, blockquote bar (onedark's comment grey; $gray$ reads at 2.1:1)
      # accents (orange brand echoes fzf's match highlight; purple = this config's signature accent)
      accent:    "$orange$"      # brand: status badge, search, H1, table headers, scrollbar
      accent2:   "$purple$"      # TOC marker, inline code, H5+, mermaid keywords
      success:   "$green$"       # watch/reload badges, tips, checked tasks, H2
      info:      "$blue$"        # links, notes, H3
      special:   "$purple$"      # LaTeX, H4, important alerts
      warning:   "$yellow$"      # warning status + alerts
      danger:    "$red$"         # errors, caution alerts

  ghostty:
    name: "Atom One Dark"

  kitty:

  zsh:
    colors:
      red: 204
      cyan: 38
      blue: 39
      green: 114
      yellow: 180
      magenta: 170
      comment: "$comment$"

  colorls:
    unrecognized_file: "$blue$"
    recognized_file: "$cyan$"
    executable_file: "$green$"
    dir: "$orange$"
    dead_link: "$red$"
    link: "$cyan$"
    device: "$green$"
    write: "$blue$"
    read: "$purple$"
    exec: "$red$"
    no_access: "$comment$"
    day_old: "$purple$"
    hour_old: "$orange$"
    no_modifier: "$gray$"
    file_large: "$orange$"
    file_medium: "$yellow$"
    file_small: "$comment$"
    report: "$fg$"
    user: "$blue$"
    tree: "$gray$"
    empty: "$yellow$"
    error: "$red$"
    normal: "$white$"
    inode: "$blue$"
    addition: "$green$"
    modification: "$yellow$"
    deletion: "$red$"
    untracked: "$orange$"
    unchanged: "$cyan$"

  nvim:
    colorscheme: "onedark"
    scheme: "onedark"
    theme: "onedark"
    vanilla: true
    winblend: 0
    plugin: |
      {
        "olimorris/onedarkpro.nvim",
        priority = 1000, -- Ensure it loads first
      }
    fields:
      bg: "bg"
      fg: "fg"
      alt_bg: "bg_statusline"
      alt_fg: "gray"
      comment: "comment"
      yellow: "yellow"
      green: "green"
      orange: "orange"
      blue: "blue"
      red: "red"
      mauve: "purple"
      pink: "purple"
      teal: "cyan"
      sky: "blue"
      accent: "purple"
      dark_bg: "float_bg"
      light_bg: "selection"
      none: "NONE"
