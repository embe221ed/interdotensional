
# === pane-mode: a persistent modal table for move/resize/zoom ===
# prefix + Enter enters it; h/j/k/l move, H/J/K/L resize, z zoom, q/Esc (or any unbound key) exits.
# Each move/resize re-enters the table so it stays modal without swallowing the next keystroke.
bind-key Enter switch-client -T pane-mode
bind-key -T pane-mode h { select-pane -L ; switch-client -T pane-mode }
bind-key -T pane-mode j { select-pane -D ; switch-client -T pane-mode }
bind-key -T pane-mode k { select-pane -U ; switch-client -T pane-mode }
bind-key -T pane-mode l { select-pane -R ; switch-client -T pane-mode }
bind-key -T pane-mode H { resize-pane -L 2 ; switch-client -T pane-mode }
bind-key -T pane-mode J { resize-pane -D 2 ; switch-client -T pane-mode }
bind-key -T pane-mode K { resize-pane -U 2 ; switch-client -T pane-mode }
bind-key -T pane-mode L { resize-pane -R 2 ; switch-client -T pane-mode }
bind-key -T pane-mode z { resize-pane -Z ; switch-client -T pane-mode }
bind-key -T pane-mode q switch-client -T root
bind-key -T pane-mode Escape switch-client -T root
