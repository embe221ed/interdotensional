name: "nord"
polarity: "dark"

tools:

  tmux:
    clock: 110
    colors:
      dim: "$brighter$"
      pink: "$purple$"
      yellow: "$yellow$"
      selected:
        fg: "$purple$"
        bg: "$bright$"

  fzf:
    fg: "$snow$"
    bg: "-1"
    hl: "$orange$"
    selected_bg: "$brighter$"
    info: "$ice$"
    border: "$purple$"
    prompt: "$green$"
    pointer: "$red$"
    marker: "$yellow$"
    spinner: "$polar_water$"
    header: "$light$"
    separator: "$brightest$"
    label: "$snow$"

  ipython:
    pygments_style: "nord"

  leaf:
    base: "ocean"                # built-in preset backing any key the theme doesn't set
    syntax: "base16-ocean.dark"  # syntect theme for fenced code blocks
    colors:
      # surfaces (polar night steps: origin content, nord1 chrome, nord2 chips)
      bg:        "$origin$"      # content background
      bg_deep:   "$bright$"      # chrome: TOC + status bar background
      panel:     "$brighter$"    # chips: filename/search badges, inline code, active TOC row
      border:    "$brightest$"   # hard lines: rules, heading underline, table separators
      faint:     "$light$"       # soft lines: code frame/gutter, table borders, inactive TOC index ($brighter$ is invisible on the nord1 chrome)
      # text ladder (snow storm body, stepping down into polar night greys)
      fg:        "$snow$"        # body text
      fg_strong: "$snow_brightest$" # bold text, active TOC entry, marked text
      muted:     "$snow$"        # de-emphasized: inactive TOC entries (no step exists between nord3.5 and nord4; $light$ is unreadable at 2:1)
      dim:       "$light$"       # chrome text: separators, shortcuts, code labels, blockquote bar (nord3.5, the palette's designated dim-text shade)
      # accents (frost ice brand, aurora orange secondary — echoes fzf hl)
      accent:    "$ice$"         # brand: status badge, search, H1, table headers, scrollbar
      accent2:   "$orange$"      # TOC marker, inline code, H5+, mermaid keywords
      success:   "$green$"       # watch/reload badges, tips, checked tasks, H2
      info:      "$artic_ocean$" # links, notes, H3 (nord10; $artic_water$ is near-identical to the ice H1)
      special:   "$purple$"      # LaTeX, H4, important alerts
      warning:   "$yellow$"      # warning status + alerts
      danger:    "$red$"         # errors, caution alerts

  ghostty:
    name: "Nord"

  kitty:
    name: "Nord"

  zsh:
    colors:
      red: 131
      cyan: 116
      blue: 110
      green: 108
      yellow: 222
      magenta: 139
      comment: "$light$"

  colorls:
    unrecognized_file: "$artic_water$"
    recognized_file: "$polar_water$"
    executable_file: "$green$"
    dir: "$orange$"
    dead_link: "$red$"
    link: "$polar_water$"
    device: "$green$"
    write: "$artic_water$"
    read: "$purple$"
    exec: "$purple$"
    no_access: "$light$"
    day_old: "$purple$"
    hour_old: "$orange$"
    no_modifier: "$brightest$"
    file_large: "$orange$"
    file_medium: "$yellow$"
    file_small: "$light$"
    report: "$snow$"
    user: "$artic_water$"
    tree: "$brightest$"
    empty: "$yellow$"
    error: "$red$"
    normal: "$snow$"
    inode: "$artic_water$"
    addition: "$green$"
    modification: "$yellow$"
    deletion: "$red$"
    untracked: "$orange$"
    unchanged: "$polar_water$"

  nvim:
    colorscheme: "nord"
    scheme: "nord"
    theme: "polar_night"
    vanilla: false
    winblend: 8
    plugin: |
      {
            "gbprod/nord.nvim",
            lazy = false,
            priority = 1000,
          }
    fields:
      bg: "polar_night.origin"
      fg: "snow_storm.origin"
      alt_bg: "polar_night.bright"
      alt_fg: "polar_night.brightest"
      comment: "polar_night.light"
      yellow: "aurora.yellow"
      green: "aurora.green"
      orange: "aurora.orange"
      blue: "frost.ice"
      red: "aurora.red"
      mauve: "aurora.purple"
      pink: "aurora.purple"
      teal: "frost.polar_water"
      sky: "frost.ice"
      accent: "frost.artic_ocean"
      dark_bg: "polar_night.brighter"
      light_bg: "polar_night.brightest"
      none: "NONE"
