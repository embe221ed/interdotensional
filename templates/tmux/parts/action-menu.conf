
# === action menu (prefix + a): launches real pane actions; mnemonics match the direct keys ===
# inherits the themed menu chrome (menu-style / menu-border-*) set above
bind-key a display-menu -T "#[align=centre] actions " -x C -y C \
  "Split right"     "|" "split-window -h -c '#{pane_current_path}'" \
  "Split below"     "-" "split-window -v -c '#{pane_current_path}'" \
  "Floating pane"   "*" "new-pane -c '#{pane_current_path}' -S 'fg={{ tmux_theme.colors.pink }}' -R 'fg={{ tmux_theme.colors.dim }}'" \
  "Scratch popup"   "p" "display-popup -w70% -h70% -E 'tmux has-session -t scratch 2>/dev/null || tmux new-session -d -s scratch -c ~; tmux set-option -t scratch detach-on-destroy on; tmux attach -t scratch'" \
  "" \
  "New window"      "c" "new-window -c '#{pane_current_path}'" \
  "Rename window"   "," "command-prompt -I '#W' 'rename-window -- %%'" \
  "Break to window" "!" "break-pane" \
  "Window tree"     "w" "choose-tree -Zw" \
  "" \
  "Toggle sync"     "s" "set-window-option synchronize-panes" \
  "Zoom pane"       "z" "resize-pane -Z" \
  "Pane mode"       "m" "switch-client -T pane-mode" \
  "Copy mode"       "[" "copy-mode" \
  "Swap pane →"  "o" "swap-pane -D" \
  "Respawn pane"    "R" "respawn-pane -k" \
  "" \
  "Kill pane"       "x" "confirm-before -p 'kill pane #P? (y/n)' kill-pane" \
  "Kill window"     "X" "confirm-before -p 'kill window #W? (y/n)' kill-window"
