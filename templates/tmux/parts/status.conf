
# status line
set-option -g status on
set-option -g status-interval 2
set-option -g status-style "bg=default,fg={{ tmux_theme.colors.dim }}"

# left: a quiet session sigil (the session name lives here now, not on the right rail)
set-option -g status-left "#[fg={{ tmux_theme.colors.dim }}] #S #[fg={{ tmux_theme.colors.pink }}]❯ "
set-option -g status-left-length 30

# right: context + transient flags only — remote host (SSH only), key-table / nested off-mode, prefix, copy-mode, sync
set-option -g status-right-length 70
set-option -g status-right "#{?SSH_CONNECTION,#[fg={{ tmux_theme.colors.pink }}] #{host_short} ,}#{?#{==:#{client_key_table},off},#[fg={{ tmux_theme.colors.pink }}]󰌾 ,}#{?#{||:#{||:#{==:#{client_key_table},root},#{==:#{client_key_table},prefix}},#{==:#{client_key_table},off}},,#[fg={{ tmux_theme.colors.pink }}]#{client_key_table} }#{?client_prefix,#[fg={{ tmux_theme.colors.yellow }}]● ,}#{?pane_in_mode,#[fg={{ tmux_theme.colors.pink }}]▲ ,}#{?pane_synchronized,#[fg=red]⇋ ,}#[fg=default]"

# windows: left-aligned index:name list with the ❘ bufferline separator, plus a state palette
set-option -g status-justify left
set -g window-status-separator "#[fg={{ tmux_theme.colors.dim }}]❘ "
set -g window-status-format "#I:#W "
set -g window-status-current-format "#I:#W "
set -g window-status-current-style "#{?window_zoomed_flag,fg={{ tmux_theme.colors.yellow }},fg={{ tmux_theme.colors.pink }}},bold"
set -g window-status-style "fg={{ tmux_theme.colors.dim }}"
set -g window-status-activity-style "fg={{ tmux_theme.colors.yellow }},nobold"
set -g window-status-bell-style "fg=red,nobold"
