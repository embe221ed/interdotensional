name: "tokyonight-day"
polarity: "light"
pair: "tokyonight-storm"

tools:

  tmux:
    clock: 213
    colors:
      dim: "$dark3$"
      pink: "$magenta2$"
      yellow: "$yellow$"
      selected:
        fg: "$magenta2$"
        bg: "$bg_dark$"

  kitty:
    name: "Tokyonight-Day"

  fzf:
    fg: "$fg$"
    bg: "-1"
    hl: "$orange$"
    selected_bg: "$bg_highlight$"
    info: "$blue$"
    border: "$magenta2$"
    prompt: "$green$"
    pointer: "$red$"
    marker: "$yellow$"
    spinner: "$magenta$"
    header: "$dark3$"
    separator: "$fg_gutter$"
    label: "$fg_dark$"

  ipython:
    pygments_style: "friendly"

  leaf:
    base: "ocean"                 # built-in preset backing any key the theme doesn't set
    syntax: "base16-ocean.light"  # syntect theme for fenced code blocks
    # Day's mid-lightness blues can't carry text on the grey chips; darken
    # them for text roles, keep raw brand colors for surfaces.
    text_darken:
      accent: 8  # blue -> #176ade-ish (3.2:1 on the panel chip)
      strong: 9  # fg -> #2d4e9b (4.7:1 on the panel chip; fg is day's darkest neutral)
    colors:
      # surfaces
      bg:        "$bg$"            # content background
      bg_deep:   "$bg_dark$"       # chrome: TOC + status bar background
      panel:     "$bg_highlight$"  # chips: filename/search badges, inline code, active TOC row
      border:    "$blue0$"         # hard lines: rules, heading underline, table separators (periwinkle border_highlight)
      faint:     "$fg_gutter$"     # soft lines: code frame/gutter, table borders, inactive TOC index
      # text ladder (day's fg is the darkest neutral, so bold reuses it — weight carries emphasis)
      fg:        "$fg$"            # body text
      fg_strong: "$fg$"            # bold text, active TOC entry, marked text
      muted:     "$dark5$"         # de-emphasized: inactive TOC entries
      dim:       "$comment$"       # chrome text: separators, shortcuts, code labels, blockquote bar
      # accents (tokyonight idiom: blue brand, magenta keywords, teal for links)
      accent:    "$blue$"          # brand: status badge, search, H1, table headers, scrollbar
      accent2:   "$magenta2$"      # TOC marker, inline code, H5+, mermaid keywords (day's own fzf/tmux/nvim accent; magenta is too light for chip text)
      success:   "$green$"         # watch/reload badges, tips, checked tasks, H2
      info:      "$blue1$"         # links, notes, H3 (teal keeps H3 distinct from the blue H1)
      special:   "$purple$"        # LaTeX, H4, important alerts
      warning:   "$yellow$"        # warning status + alerts
      danger:    "$red1$"          # errors, caution alerts (print-red; $red$ washes out on the tinted badge)

  ghostty:
    name: "TokyoNight Day"

  zsh:
    colors:
      red: 197
      cyan: 31
      blue: 68
      green: 65
      yellow: 94
      magenta: 98
      comment: "$comment$"

  colorls:
    unrecognized_file: "$blue$"
    recognized_file: "$cyan$"
    executable_file: "$green$"
    dir: "$orange$"
    dead_link: "$red$"
    link: "$cyan$"
    device: "$green$"
    write: "$blue$"
    read: "$purple$"
    exec: "$magenta2$"
    no_access: "$dark3$"
    day_old: "$purple$"
    hour_old: "$orange$"
    no_modifier: "$comment$"
    file_large: "$orange$"
    file_medium: "$yellow$"
    file_small: "$fg_dark$"
    report: "$fg$"
    user: "$blue$"
    tree: "$comment$"
    empty: "$yellow$"
    error: "$red$"
    normal: "$fg_dark$"
    inode: "$blue$"
    addition: "$green$"
    modification: "$yellow$"
    deletion: "$red$"
    untracked: "$orange$"
    unchanged: "$cyan$"

  nvim:
    colorscheme: "tokyonight"
    theme: "day"
    vanilla: false
    winblend: 0
    plugin: |
      {
        "folke/tokyonight.nvim",
        lazy = false,
        priority = 1000,
        opts = {},
      }
    fields:
      bg: "bg"
      fg: "fg"
      alt_bg: "bg_dark"
      alt_fg: "fg_gutter"
      comment: "comment"
      yellow: "yellow"
      green: "green"
      orange: "orange"
      blue: "blue"
      red: "red"
      mauve: "magenta"
      pink: "magenta2"
      teal: "blue1"
      sky: "blue5"
      accent: "magenta2"
      dark_bg: "bg_dark1"
      light_bg: "bg_highlight"
      none: "NONE"
