name: "catppuccin-latte"
polarity: "light"
pair: "catppuccin-frappe"

tools:

  tmux:
    clock: 13
    colors:
      dim: "$overlay0$"
      pink: "$pink$"
      yellow: "$yellow$"
      selected:
        fg: "$pink$"
        bg: "$surface0$"

  kitty:

  fzf:
    fg: "$text$"
    bg: "-1"
    hl: "$peach$"
    selected_bg: "$surface1$"
    info: "$blue$"
    border: "$pink$"
    prompt: "$green$"
    pointer: "$red$"
    marker: "$yellow$"
    spinner: "$mauve$"
    header: "$overlay1$"
    separator: "$overlay0$"
    label: "$subtext1$"

  ipython:
    pygments_style: "friendly"

  ghostty:
    name: "Catppuccin Latte"

  zsh:
    colors:
      red: 203
      cyan: 39
      blue: 110
      green: 149
      yellow: 179
      magenta: 176

  colorls:
    unrecognized_file: blue
    recognized_file: darkcyan
    executable_file: red
    dir: fuchsia
    dead_link: red
    link: cyan
    device: darkgray
    write: royalblue
    read: magenta
    exec: deeppink
    no_access: dimgray
    day_old: red
    hour_old: coral
    no_modifier: darkviolet
    file_large: red
    file_medium: coral
    file_small: darkgray
    report: darkviolet
    user: darkblue
    tree: cyan
    empty: yellow
    error: red
    normal: darkgray
    inode: violet
    addition: chartreuse
    modification: darkkhaki
    deletion: darkred
    untracked: darkorange
    unchanged: darkgreen

  nvim:
    colorscheme: "catppuccin"
    theme: "latte"
    vanilla: false
    winblend: 15
    plugin: |
      { "catppuccin/nvim", name = "catppuccin", priority = 1000 }
    fields:
      bg: "base"
      fg: "text"
      alt_bg: "mantle"
      alt_fg: "surface1"
      comment: "overlay0"
      yellow: "yellow"
      green: "green"
      orange: "peach"
      blue: "blue"
      red: "red"
      mauve: "mauve"
      pink: "pink"
      teal: "teal"
      sky: "sky"
      accent: "pink"
      dark_bg: "crust"
      light_bg: "surface0"
      none: "NONE"
