name: "catppuccin-latte"
polarity: "light"
pair: "catppuccin-frappe"

tools:

  tmux:
    clock: 13
    colors:
      dim: "$overlay0$"
      pink: "$pink$"
      yellow: "$yellow$"
      selected:
        fg: "$pink$"
        bg: "$surface0$"

  kitty:

  fzf:
    fg: "$text$"
    bg: "-1"
    hl: "$peach$"
    selected_bg: "$surface1$"
    info: "$blue$"
    border: "$pink$"
    prompt: "$green$"
    pointer: "$red$"
    marker: "$yellow$"
    spinner: "$mauve$"
    header: "$overlay1$"
    separator: "$overlay0$"
    label: "$subtext1$"

  ipython:
    pygments_style: "friendly"

  leaf:
    base: "ocean"                 # built-in preset backing any key the theme doesn't set
    syntax: "base16-ocean.light"  # syntect theme for fenced code blocks (its bg is latte's base)
    # Latte's pastel accents can't carry text on the light chips (pink on
    # surface0 is 1.7:1); darken them for text roles, keep raw brand colors
    # for surfaces (brand badge, search match, scrollbar).
    text_darken:
      accent: 22   # pink -> deep magenta-pink #d020a1 (3.1:1 on surface0, 4.2:1 on base)
      accent2: 12  # teal -> ink teal #0f5f64 (4.8:1 on surface0)
      warning: 12  # yellow -> amber #a96c16 (3.6:1 on mantle)
      success: 6   # green -> #368825 (3.2:1 on the watch badge, 4:1 as H2)
    colors:
      # surfaces
      bg:        "$base$"      # content background
      bg_deep:   "$mantle$"    # chrome: TOC + status bar background
      panel:     "$surface0$"  # chips: filename/search badges, inline code, active TOC row
      border:    "$overlay0$"  # hard lines: rules, heading underline, table separators
      faint:     "$surface1$"  # soft lines: code frame/gutter, table borders, inactive TOC index
      # text ladder (latte has no neutral darker than text, so bold reuses it)
      fg:        "$text$"      # body text
      fg_strong: "$text$"      # bold text, active TOC entry, marked text
      muted:     "$subtext0$"  # de-emphasized: inactive TOC entries
      dim:       "$overlay1$"  # chrome text: separators, shortcuts, code labels, blockquote bar
      # accents (pink brand echoes tmux/nvim; teal secondary keeps mauve free for H4)
      accent:    "$pink$"      # brand: status badge, search, H1, table headers, scrollbar
      accent2:   "$teal$"      # TOC marker, inline code, H5+, mermaid keywords
      success:   "$green$"     # watch/reload badges, tips, checked tasks, H2
      info:      "$blue$"      # links, notes, H3
      special:   "$mauve$"     # LaTeX, H4, important alerts
      warning:   "$yellow$"    # warning status + alerts
      danger:    "$red$"       # errors, caution alerts

  ghostty:
    name: "Catppuccin Latte"

  zsh:
    colors:
      red: 203
      cyan: 39
      blue: 110
      green: 149
      yellow: 179
      magenta: 176
      comment: "$overlay1$"

  colorls:
    unrecognized_file: blue
    recognized_file: darkcyan
    executable_file: red
    dir: fuchsia
    dead_link: red
    link: cyan
    device: darkgray
    write: royalblue
    read: magenta
    exec: deeppink
    no_access: dimgray
    day_old: red
    hour_old: coral
    no_modifier: darkviolet
    file_large: red
    file_medium: coral
    file_small: darkgray
    report: darkviolet
    user: darkblue
    tree: cyan
    empty: yellow
    error: red
    normal: darkgray
    inode: violet
    addition: chartreuse
    modification: darkkhaki
    deletion: darkred
    untracked: darkorange
    unchanged: darkgreen

  nvim:
    colorscheme: "catppuccin"
    theme: "latte"
    vanilla: false
    winblend: 15
    plugin: |
      { "catppuccin/nvim", name = "catppuccin", priority = 1000 }
    fields:
      bg: "base"
      fg: "text"
      alt_bg: "mantle"
      alt_fg: "surface1"
      comment: "overlay0"
      yellow: "yellow"
      green: "green"
      orange: "peach"
      blue: "blue"
      red: "red"
      mauve: "mauve"
      pink: "pink"
      teal: "teal"
      sky: "sky"
      accent: "pink"
      dark_bg: "crust"
      light_bg: "surface0"
      none: "NONE"
